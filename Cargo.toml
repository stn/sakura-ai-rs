[package]
name = "sakura-ai-rs"
version = "0.1.0"
description = "A Rust library for interacting with the Sakura AI Engine"
edition = "2024"
authors = ["Akira Ishino <akira@lumilab.jp>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/stn/sakura-ai-rs"
repository = "https://github.com/stn/sakura-ai-rs"

[dependencies]
async-stream = "0.3.5"
chrono = "0.4.42"
http = { version = "1.3.1", optional = true }
ollama-rs = "0.3.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1.17", optional = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
futures-util = "0.3"
sakura-ai-rs = { path = ".", features = [
    "stream",
    "headers",
] }
tokio-test = "0.4.4"

[features]
default = ["reqwest/default-tls"]
stream = ["tokio-stream", "reqwest/stream", "tokio", "ollama-rs/stream"]
headers = ["http", "ollama-rs/headers"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
